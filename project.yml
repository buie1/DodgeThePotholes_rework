name: DodgeThePotholes
options:
  bundleIdPrefix: edu.duke
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "26.4"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: 5.10
    TARGETED_DEVICE_FAMILY: "1"           # iPhone only
    SUPPORTS_MACCATALYST: false
    ENABLE_PREVIEWS: true

targets:
  DodgeThePotholes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DodgeThePotholes
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.duke.DodgeThePotholes
        SWIFT_VERSION: 5.10
        INFOPLIST_FILE: DodgeThePotholes/App/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: false
        # Silence the "no UIApplicationSceneManifest" warning — SwiftUI lifecycle
        UIApplicationSceneManifest: ""
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreHaptics.framework
      - sdk: SpriteKit.framework
      - sdk: GameKit.framework
    info:
      path: DodgeThePotholes/App/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSMotionUsageDescription: "Used for tilt-based steering controls."
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - PressStart2P.ttf

  DodgeThePotholesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DodgeThePotholesTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.duke.DodgeThePotholesTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: 5.10
    dependencies:
      - target: DodgeThePotholes

schemes:
  DodgeThePotholes:
    build:
      targets:
        DodgeThePotholes: all
        DodgeThePotholesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DodgeThePotholesTests
